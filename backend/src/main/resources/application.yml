spring:
  application:
    name: stockwise-api
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

stockwise:
  public-url: ${STOCKWISE_PUBLIC_URL:http://localhost:4173}
  frontend-url: ${STOCKWISE_FRONTEND_URL:http://localhost:5173}
  microsoft:
    tenant-id: ${MICROSOFT_TENANT_ID:}
    client-id: ${MICROSOFT_CLIENT_ID:}
    client-secret: ${MICROSOFT_CLIENT_SECRET:}
    redirect-uri: ${MICROSOFT_REDIRECT_URI:http://localhost:8080/api/v1/excel-sync/microsoft/callback}
    token-encryption-key: ${STOCKWISE_MICROSOFT_TOKEN_ENCRYPTION_KEY:}
  excel-sync:
    poll-interval-ms: ${STOCKWISE_EXCEL_SYNC_POLL_INTERVAL_MS:5000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
