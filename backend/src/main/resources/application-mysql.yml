spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/mysql
    clean-disabled: true

stockwise:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
  auth:
    jwt:
      issuer: ${STOCKWISE_JWT_ISSUER:https://api.stockwise.example}
      audience: ${STOCKWISE_JWT_AUDIENCE:stockwise-web}
      signing-secret: ${STOCKWISE_JWT_SIGNING_SECRET}
    csrf:
      secret: ${STOCKWISE_CSRF_HMAC_SECRET}
    refresh-cookie:
      secure: ${STOCKWISE_AUTH_REFRESH_COOKIE_SECURE}
      same-site: ${STOCKWISE_AUTH_REFRESH_COOKIE_SAME_SITE}
